    <!-- Suppress benign Vite HMR websocket reconnection noise in sandboxed iframe -->
    <script>
      (function() {
        var _origError = console.error;
        var _origWarn = console.warn;
        console.error = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && arguments[0].includes('[vite]')) {
            return;
          }
          return _origError.apply(console, arguments);
        };
        console.warn = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && arguments[0].includes('[vite]')) {
            return;
          }
          return _origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          var msg = e && e.reason && (e.reason.message || String(e.reason));
          if (typeof msg === 'string' && (msg.includes('[vite]') || msg.includes('WebSocket closed without opened'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && e.error.message));
          if (typeof msg === 'string' && (msg.includes('[vite]') || msg.includes('WebSocket closed without opened'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isViteHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('24678') !== -1)) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var listeners = {};
              var dummyWs = {
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: url,
                protocol: 'vite-hmr',
                extensions: '',
                binaryType: 'blob',
                bufferedAmount: 0,
                send: function() {},
                close: function() {
                  dummyWs.readyState = 3;
                  dummyWs.dispatchEvent(new Event('close'));
                },
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                },
                dispatchEvent: function(event) {
                  var list = listeners[event.type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i].call(dummyWs, event); } catch (err) {}
                  }
                  if (dummyWs['on' + event.type]) {
                    try { dummyWs['on' + event.type].call(dummyWs, event); } catch (err) {}
                  }
                  return true;
                }
              };

              setTimeout(function() {
                if (dummyWs.readyState === 1) {
                  dummyWs.dispatchEvent(new Event('open'));
                }
              }, 0);

              return dummyWs;
            }

            return new OrigWebSocket(url, protocols);
          };

          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
