<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Jamal Movies — Watch Free Cinema, Trailers & Discover Movies Online</title>
    <meta name="title" content="Jamal Movies — Watch Free Cinema, Trailers & Discover Movies Online" />
    <meta name="description" content="Discover popular movies, trending blockbusters, official HD trailers, cast details, ratings, reviews, and stream verified public-domain films legal and free on Jamal Movies." />
    <meta name="keywords" content="movies, watch movies, trailers, cinema discovery, tmdb movies, stream free movies, public domain cinema, film reviews, movie ratings, top rated movies, upcoming blockbusters" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="rating" content="general" />
    <meta name="theme-color" content="#05060f" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jamal Movies Studio" />
    <meta property="og:title" content="Jamal Movies — Watch Free Cinema, Trailers & Discover Movies Online" />
    <meta property="og:description" content="Discover popular movies, trending blockbusters, official HD trailers, cast details, ratings, reviews, and stream verified public-domain films legal and free on Jamal Movies." />
    <meta property="og:image" content="https://image.tmdb.org/t/p/w1280/8YFL5QQVPy3AgrEQxNYVSgiPEbe.jpg" />
    <meta property="og:image:alt" content="Jamal Movies Cinema Explorer Banner" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Jamal Movies — Watch Free Cinema, Trailers & Discover Movies Online" />
    <meta property="twitter:description" content="Discover popular movies, trending blockbusters, official HD trailers, cast details, ratings, reviews, and stream verified public-domain films legal and free on Jamal Movies." />
    <meta property="twitter:image" content="https://image.tmdb.org/t/p/w1280/8YFL5QQVPy3AgrEQxNYVSgiPEbe.jpg" />

    <!-- Performance & Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
    <link rel="preconnect" href="https://img.youtube.com" crossorigin>
    <link rel="dns-prefetch" href="https://image.tmdb.org">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    <link rel="dns-prefetch" href="https://archive.org">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Schema.org WebSite & Organization Structured Data for Google Rich Results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "/#website",
            "url": "/",
            "name": "Jamal Movies",
            "description": "Comprehensive online cinema discovery, movie reviews, ratings, trailers, and legal public domain movie streaming platform.",
            "potentialAction": [
              {
                "@type": "SearchAction",
                "target": {
                  "@type": "EntryPoint",
                  "urlTemplate": "/?search={search_term_string}"
                },
                "query-input": "required name=search_term_string"
              }
            ]
          },
          {
            "@type": "Organization",
            "@id": "/#organization",
            "name": "Jamal Movies",
            "url": "/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://image.tmdb.org/t/p/w500/8YFL5QQVPy3AgrEQxNYVSgiPEbe.jpg"
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#05060f] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
